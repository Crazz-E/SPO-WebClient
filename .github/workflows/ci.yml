name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the changed-line coverage step diffs against origin/main.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck (server + client)
        run: npm run typecheck

      - name: Build (server + client + terrain-test)
        # The bench worker builds before every gate; CI builds too so a PR that never sat
        # on the bench (a dependency bump, an external contributor) cannot ship a tree
        # that does not compile to a runnable gateway.
        run: npm run build

      - name: Audit production dependencies (SEC-D-1)
        run: npm audit --omit=dev --audit-level=high

      - name: Tests
        run: npm test

      - name: Coverage of changed lines
        if: github.event_name == 'pull_request'
        run: npm run coverage:changed

      # The three rules CLAUDE.md states and the ruleset cannot express. This runs inside
      # the REQUIRED check rather than as a job of its own, so it blocks a merge without
      # anyone having to touch the ruleset. `rdo-approved` is posted by a human — the
      # author of a diff cannot unlock their own protected-file change.
      - name: PR rules (protected files, coverage ratchet, RDO citation)
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-pr-rules.js

      # The harness the agent itself runs on. A broken hook makes the push gate silently
      # optional, and nothing else in the suite would notice.
      - name: Skills manifest is current
        run: node .claude/generate-skills-manifest.js --check

      - name: Hooks parse
        run: bash -n .claude/hooks/*.sh scripts/*.sh
